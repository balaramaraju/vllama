[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllama"
version = "0.1.0"
description = "A small educational Llama implementation written in Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2.0",
    "datasets",
    "safetensors",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
vllama-train = "src.train.llamatrain:train"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["src*tests*"]

